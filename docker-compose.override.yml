services:
  moltbot-gateway:
    build:
      context: .
      dockerfile: Dockerfile.custom
    image: my-openclaw:custom
    environment:
      CLAWDBOT_STATE_DIR: /home/node/.openclaw
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      CLAWDBOT_BUNDLED_SKILLS_DIR: /app/skills
      CLAWDBOT_SKILLS_DIR: /app/skills
      NODE_OPTIONS: --max-old-space-size=6144
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
    volumes:
      - ${CLAWDBOT_CONFIG_DIR}:/home/node/.openclaw
      - ${CLAWDBOT_CONFIG_DIR}:/home/node/.clawdbot
      - ./skills:/app/skills
      - ./src:/app/src
    # 内存限制：5GB 内存 + 1GB swap（虚拟内存）
    # 实例有 2GB RAM + 4GB Swap = 6GB 总内存，给容器 5GB + 1GB swap
    deploy:
      resources:
        limits:
          memory: 5120M
        reservations:
          memory: 1024M
    mem_swappiness: 60
    memswap_limit: 6144M
    # 健康检查：每30秒检查一次，超时10秒，连续3次失败则标记为不健康
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:18789/__moltbot__/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  moltbot-cli:
    build:
      context: .
      dockerfile: Dockerfile.custom
    image: my-openclaw:custom
    environment:
      CLAWDBOT_STATE_DIR: /home/node/.openclaw
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      CLAWDBOT_BUNDLED_SKILLS_DIR: /app/skills
      CLAWDBOT_SKILLS_DIR: /app/skills
    volumes:
      - ${CLAWDBOT_CONFIG_DIR}:/home/node/.openclaw
      - ${CLAWDBOT_CONFIG_DIR}:/home/node/.clawdbot
      - ./skills:/app/skills
