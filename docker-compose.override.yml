services:
  moltbot-gateway:
    build:
      context: .
      dockerfile: Dockerfile.custom
    image: my-openclaw:custom
    environment:
      CLAWDBOT_STATE_DIR: /home/node/.openclaw
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      NODE_OPTIONS: --max-old-space-size=4096
      DBUS_SESSION_BUS_ADDRESS: "autolaunch:"
    volumes:
      - ${CLAWDBOT_CONFIG_DIR}:/home/node/.openclaw
      - ${CLAWDBOT_CONFIG_DIR}:/home/node/.clawdbot
      # Mount source code and skills for hot-reloading/updates
      - ./skills:/app/skills
      - ./src:/app/src

  moltbot-cli:
    build:
      context: .
      dockerfile: Dockerfile.custom
    image: my-openclaw:custom
    environment:
      CLAWDBOT_STATE_DIR: /home/node/.openclaw
      OPENCLAW_STATE_DIR: /home/node/.openclaw
    volumes:
      - ${CLAWDBOT_CONFIG_DIR}:/home/node/.openclaw
      - ${CLAWDBOT_CONFIG_DIR}:/home/node/.clawdbot
      - ./skills:/app/skills
      - ./src:/app/src
